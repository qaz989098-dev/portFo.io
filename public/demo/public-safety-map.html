<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공공안전지도 화면 시연</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
        color: #f8fafc;
        background: #0f172a;
      }

      .demo {
        width: min(100% - 2rem, 1100px);
        margin: 0 auto;
        padding: 1.5rem 0 2.5rem;
      }

      .demo__kicker {
        margin: 0 0 0.35rem;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #93c5fd;
      }

      h1 {
        margin: 0;
        font-size: 1.65rem;
        letter-spacing: -0.03em;
      }

      .demo__note {
        margin: 0.6rem 0 1.25rem;
        color: #94a3b8;
        font-size: 0.9rem;
        line-height: 1.55;
      }

      .stage {
        position: relative;
        overflow: hidden;
        background: #020617;
        border: 1px solid #1e293b;
        border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.28);
      }

      .stage img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: contain;
        background: #020617;
      }

      .caption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 1rem;
        background: #111827;
      }

      .caption strong {
        font-size: 0.95rem;
      }

      .caption span {
        color: #93c5fd;
        font-size: 0.8rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      button {
        padding: 0.55rem 0.95rem;
        border: 0;
        border-radius: 999px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }

      button.ghost {
        background: #1e293b;
        color: #e2e8f0;
      }

      a.back {
        display: inline-block;
        margin-top: 1.25rem;
        color: #93c5fd;
        font-size: 0.875rem;
        text-decoration: none;
      }

      a.back:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <p class="demo__kicker">TEAM 3 · SAFETY</p>
      <h1>공공안전지도 화면 시연</h1>
      <p class="demo__note">
        운영 중인 지도 서비스가 아니라, 실제 웹·앱 화면을 모아 보여 줍니다. 4초마다 넘어가며, 버튼으로 멈추거나 넘길 수 있습니다.
      </p>
      <div class="stage">
        <img id="slide" alt="" />
        <div class="caption">
          <strong id="caption"></strong>
          <span id="index"></span>
        </div>
      </div>
      <div class="controls">
        <button type="button" class="ghost" id="prev">이전</button>
        <button type="button" id="toggle">일시정지</button>
        <button type="button" class="ghost" id="next">다음</button>
      </div>
      <a class="back" href="/portFo.io/projects/public-safety-map">← 프로젝트 상세</a>
    </main>
    <script>
      const slides = [
        {
          src: '/portFo.io/assets/images/public-safety-map/cover.png',
          caption: 'Web · 안전등급 격자 지도',
        },
        {
          src: '/portFo.io/assets/images/public-safety-map/01-map.png',
          caption: 'App · 롱프레스 목적지 지정',
        },
        {
          src: '/portFo.io/assets/images/public-safety-map/02-app.png',
          caption: 'App · 경로 선택 · CCTV 경유',
        },
        {
          src: '/portFo.io/assets/images/public-safety-map/03-admin.png',
          caption: 'App · 안내 시작 · 경로 미리보기',
        },
        {
          src: '/portFo.io/assets/images/public-safety-map/05-panel.png',
          caption: 'App · 제보와 사고 마커',
        },
      ];

      let i = 0;
      let playing = true;
      let timer;

      const img = document.getElementById('slide');
      const caption = document.getElementById('caption');
      const index = document.getElementById('index');
      const toggle = document.getElementById('toggle');

      function show(n) {
        i = (n + slides.length) % slides.length;
        img.src = slides[i].src;
        img.alt = slides[i].caption;
        caption.textContent = slides[i].caption;
        index.textContent = i + 1 + ' / ' + slides.length;
      }

      function tick() {
        if (playing) show(i + 1);
      }

      function start() {
        window.clearInterval(timer);
        timer = window.setInterval(tick, 4000);
      }

      document.getElementById('prev').onclick = () => show(i - 1);
      document.getElementById('next').onclick = () => show(i + 1);
      toggle.onclick = () => {
        playing = !playing;
        toggle.textContent = playing ? '일시정지' : '재생';
      };

      show(0);
      start();
    </script>
  </body>
</html>
